name: Deploy to Hostinger VPS

# Auto-deploy: every push to the production branch SSHes into the VPS and runs
# scripts/deploy.sh (pull → install → migrate → build → PM2 reload).
# Configure repo Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT (optional),
# VPS_APP_DIR (optional, defaults to /var/www/apnenews).

# NOTE: This VPS workflow is manual-only (workflow_dispatch) so it never fails
# for Vercel users. On Vercel, deploys happen automatically via Vercel's GitHub
# integration — you do NOT need this workflow. Use it only if you deploy to a
# self-managed VPS (see docs/DEPLOY-VPS.md) and have set the VPS_* secrets.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            export APP_DIR="${{ secrets.VPS_APP_DIR || '/var/www/apnenews' }}"
            export DEPLOY_BRANCH="main"
            cd "$APP_DIR"
            bash scripts/deploy.sh
